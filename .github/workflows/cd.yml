name: CD Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify-authentication:
    name: Verify GCP authentication
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/backend:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify active identity
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth print-access-token >/dev/null

          ACTIVE_ACCOUNT="$(gcloud auth list \
            --filter=status:ACTIVE \
            --format='value(account)')"

          test "$ACTIVE_ACCOUNT" = "${{ vars.DEPLOYER_SERVICE_ACCOUNT }}"
          echo "Authenticated as: $ACTIVE_ACCOUNT"
          gcloud config get-value project

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Verify image URI
        run: echo "Image URI:${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag "${IMAGE_URI}" \
            .

      - name: Verify Docker image
        run: |
          docker image inspect "${IMAGE_URI}" \
            --format='Image: {{.RepoTags}} | Platform: {{.Os}}/{{.Architecture}}'

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Update migration job image
        run: |
          gcloud run jobs update "${{ vars.CLOUD_RUN_MIGRATION_JOB }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${IMAGE_URI}" \
            --quiet

      - name: Run database migrations
        run: |
          gcloud run jobs execute "${{ vars.CLOUD_RUN_MIGRATION_JOB }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --wait \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${IMAGE_URI}" \
            --service-account="${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --quiet
